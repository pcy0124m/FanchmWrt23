name: Build FanchmWrt

# ============================================================================
# 云端编译: 推送代码后 GitHub 自动编出固件, 不占用本机资源
#
# 产物: fanchmwrt-*-ramips-mt7621-jdcloud_re-sp-01b-squashfs-sysupgrade.bin
# 下载: 仓库首页 Releases，或 Actions Artifacts
# ============================================================================

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'FanchmWrt 源码分支'
        required: false
        default: 'fanchmwrt-25.12.4'
      jobs:
        description: '编译并行度 (内存不足时改小)'
        required: false
        default: '3'
  # 需要定时跟踪上游更新时取消下面的注释
  # schedule:
  #   - cron: '0 20 * * 0'

permissions:
  contents: write

jobs:
  build:
    name: 编译 jdcloud_re-sp-01b
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      SOURCE_REPO: https://github.com/fanchmwrt/fanchmwrt.git
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || 'fanchmwrt-25.12.4' }}
      JOBS: ${{ github.event.inputs.jobs || '3' }}
      DOWNLOAD_JOBS: '6'

    steps:
      - name: 检出本工程
        uses: actions/checkout@v4

      - name: 静态检查脚本与配置
        run: |
          set -euo pipefail
          bash -n scripts/build.sh
          bash -n scripts/diy.sh
          sh   -n files/etc/uci-defaults/99-fanchmwrt
          echo "脚本语法检查通过"

          # 种子配置里不允许出现重复的键, 否则 defconfig 行为不确定
          dup=$(grep -E '^CONFIG_[A-Za-z0-9_]+=' configs/fanchmwrt-25.12.seed \
                | cut -d= -f1 | sort | uniq -d || true)
          if [ -n "$dup" ]; then
            echo "种子配置存在重复键:"
            echo "$dup"
            exit 1
          fi
          echo "配置无重复键"

      - name: 释放磁盘空间 (OpenWrt 编译需要约 25GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          # python3-distutils 在 Ubuntu 24.04 已并入 setuptools, 用 || true 兼容
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget ca-certificates
          sudo apt-get install -y python3-distutils || true
          gawk --version | head -1

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.SOURCE_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.SOURCE_BRANCH }}-

      - name: 编译固件
        run: |
          ./scripts/build.sh 2>&1 | tee build.log

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-jdcloud_re-sp-01b
          path: |
            build/fanchmwrt/bin/targets/ramips/mt7621/*.bin
            build/fanchmwrt/bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
          retention-days: 30

      - name: 上传编译日志 (失败时用于排查)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 发布 Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ github.run_number }}
          name: FanchmWrt jdcloud_re-sp-01b #${{ github.run_number }}
          files: |
            build/fanchmwrt/bin/targets/ramips/mt7621/*.bin
            build/fanchmwrt/bin/targets/ramips/mt7621/sha256sums
          generate_release_notes: true
          draft: false
          prerelease: false
